<script>
'use strict';
/* Filmmaand spelletjes: a sampler. A game lives in the chat as a card; tap it to play full-screen; your result goes back
   into the chat as a card; friends answer. Pudding Hop = same seeded course for everyone, runs recorded as jump frames and
   replayed as ghosts. Biljart = turn-based 8-ball, a turn = shots + the authoritative end state. Everything local, no network. */
const $=s=>document.querySelector(s);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let FRAME=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261>>>0;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0}
const ell=(cx,cy,rx,ry,n=16)=>Array.from({length:n},(_,i)=>[cx+Math.cos(i/n*Math.PI*2)*rx,cy+Math.sin(i/n*Math.PI*2)*ry]);
const RGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const FONT='"Segoe Print","Comic Sans MS","Chalkboard SE","Marker Felt",cursive';
// a pen whose lines are redrawn by hand 12 times a second (they boil); the same seed + frame = the same wobble
function pen(c,seed){const R=mulberry32(((Math.imul(seed|0,2654435761))^Math.imul(still?0:FRAME,40503))>>>0),j=a=>(R()-.5)*a;
 const path=(P,a,close)=>{c.beginPath();P.forEach(([x,y],i)=>{const X=x+j(a),Y=y+j(a);i?c.lineTo(X,Y):c.moveTo(X,Y)});if(close)c.closePath()};
 const p={j,
  line(P,col,w=1.4,a=.9,close=false){c.lineJoin=c.lineCap='round';c.strokeStyle=col;c.lineWidth=w;path(P,a,close);c.stroke()},
  shape(P,fill,col,w=1.4,a=.9){c.lineJoin=c.lineCap='round';path(P,a,true);if(fill){c.fillStyle=fill;c.fill()}if(col){c.strokeStyle=col;c.lineWidth=w;c.stroke()}},
  dot(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x+j(.4),y+j(.4),r,0,7);c.fill()},
  ring(x,y,r,col,w=1.2,a=.6,n=14){p.line(ell(x,y,r,r,n),col,w,a,true)},
  text(s,x,y,size,col,align){c.font='bold '+size+'px '+FONT;c.fillStyle=col;c.textBaseline='alphabetic';c.textAlign='left';
   let w=0;for(const ch of s)w+=c.measureText(ch).width;let cx=align==='center'?x-w/2:align==='right'?x-w:x;
   for(const ch of s){c.fillText(ch,cx+j(.6),y+j(.6));cx+=c.measureText(ch).width}return w}};
 return p}
// three inks, hard pixels: paper, red, black
function ink3(c,w,h){const im=c.getImageData(0,0,w,h),d=im.data;
 for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const lum=.3*r+.59*g+.11*b;
  if(lum>175){d[i]=d[i+1]=d[i+2]=255}else if(r-g>70){d[i]=224;d[i+1]=48;d[i+2]=42}else{d[i]=d[i+1]=d[i+2]=17}d[i+3]=255}
 c.putImageData(im,0,0)}
// the jelly cat (same outline as the chat's sticker), in a 100-unit box, base at y=74
const K=[[24,74],[23,61],[26,47],[31,37],[35,31],[36,18],[45,27],[55,27],[64,18],[65,31],[69,37],[74,47],[77,61],[76,74]];
const OUT=(()=>{const P=[],n=6;for(let i=0;i<K.length-1;i++){const p0=K[Math.max(0,i-1)],p1=K[i],p2=K[i+1],p3=K[Math.min(K.length-1,i+2)];
 for(let s=0;s<n;s++){const t=s/n,t2=t*t,t3=t2*t;P.push([0,1].map(j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}
 P.push(K[K.length-1]);return P})();
function cat(p,x,y,s,o={}){const sx=o.sx||1,sy=o.sy||1,rot=o.rot||0,cs=Math.cos(rot),sn=Math.sin(rot);
 const tr=([a,b])=>{let X=(a-50)*s*sx,Y=(b-74)*s*sy;if(rot){const Y0=Y+14*s;const X2=X*cs-Y0*sn,Y2=X*sn+Y0*cs-14*s;X=X2;Y=Y2}return[x+X,y+Y]};
 const col=o.col||'#e0302a';p.shape(OUT.map(tr),o.fill===undefined?'#fff':o.fill,col,o.w||Math.max(1.2,2.6*s),o.a===undefined?.8:o.a);
 if(o.bare)return;
 for(const [a,b,l] of [[64,48,7],[67,56,6]])p.line([tr([a,b]),tr([a-3,b+l])],col,Math.max(1,1.5*s),.4);
 const ink=o.eyes||'#111';
 for(const ex of [43,56]){const [X,Y]=tr([ex,47]);
  if(o.dead){p.line([[X-1.7,Y-1.7],[X+1.7,Y+1.7]],ink,1.1,.2);p.line([[X-1.7,Y+1.7],[X+1.7,Y-1.7]],ink,1.1,.2)}
  else if(o.blink)p.line([[X-1.8,Y],[X+1.8,Y]],ink,1.1,.2);else p.dot(X,Y,Math.max(.9,1.9*s),ink)}}
const hhmm=()=>new Date().toTimeString().slice(0,5);
const toastEl=$('#toast');let toastT=0;function toast(t,ms=1800){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,ms)}

/* ================================================================ PUDDING HOP (runner + ghosts) */
const HOP={W:320,H:150,G:128,PX:46,DT:1/60,MAXF:60*180};
const SPD=d=>Math.min(400,150+d*.0105);
const COURSES=new Map();
// the course is a pure function of the seed: every phone builds the same obstacles in the same places
function getCourse(seed){if(COURSES.has(seed))return COURSES.get(seed);const R=mulberry32(seed),obs=[];let x=620;
 const c={obs,ensure(d){while(x<d+HOP.W+120){const v=SPD(x),r=R();let k;
   if(x>3200&&r<.13)k='double';else if(x>1700&&r<.33)k='tall';else k=['bucket','reel','clap'][(R()*3)|0];
   const o=k==='bucket'?{w:14,h:18}:k==='tall'?{w:15,h:26}:k==='reel'?{w:17,h:17}:k==='clap'?{w:22,h:15}:{w:38,h:18};
   o.k=k;o.x=x;o.id=obs.length+1;obs.push(o);x+=o.w+v*.6+38+R()*v*.9}}};
 COURSES.set(seed,c);return c}
function hopRun(seed,frames){return{seed,course:getCourse(seed),f:0,d:0,y:0,vy:0,ground:true,prevHeld:false,holdT:0,landT:0,dead:false,score:0,frames:frames||null,ip:0}}
// a recorded run = [press, release, press, release…] in simulation frames; held means press <= f < release
function ghostHeld(r){const a=r.frames;if(!a)return false;while(r.ip<a.length&&(a[r.ip+1]??Infinity)<=r.f)r.ip+=2;return r.ip<a.length&&a[r.ip]<=r.f}
function hopStep(s,held){if(s.dead)return;const dt=HOP.DT,v=SPD(s.d);s.d+=v*dt;s.course.ensure(s.d);
 if(held&&!s.prevHeld&&s.ground){s.vy=-330;s.ground=false;s.holdT=0}
 s.prevHeld=held;
 if(!s.ground){const lift=held&&s.vy<0&&s.holdT<.22;if(held)s.holdT+=dt;s.vy+=(lift?700:1900)*dt;s.y+=s.vy*dt;if(s.y>=0){s.y=0;s.vy=0;s.ground=true;s.landT=.16}}
 else if(s.landT>0)s.landT-=dt;
 const x0=s.d+HOP.PX-9,x1=s.d+HOP.PX+9,bot=HOP.G+s.y;
 for(const o of s.course.obs){if(o.x>x1)break;if(o.x+o.w<x0)continue;
  if(bot>HOP.G-o.h+3&&x1>o.x+3&&x0<o.x+o.w-3){s.dead=true;break}}
 s.f++;s.score=Math.floor(s.d/25);if(s.f>=HOP.MAXF)s.dead=true}
// a friend who "played earlier": a bot plays the same simulation and we keep only its button frames
function botRun(seed,name,target){let best=null;
 for(let attempt=0;attempt<40;attempt++){const R=mulberry32(hashStr(name+':'+attempt)^seed),s=hopRun(seed),frames=[];let pressed=false,until=0,planned=null;
  const skill=.09+.04*R();
  while(!s.dead){const px=s.d+HOP.PX;let nx=null;for(const o of s.course.obs){if(o.x+o.w>px-9){nx=o;break}}
   if(nx&&s.ground&&!pressed&&nx!==planned){const big=nx.h>20||nx.w>30,v=SPD(s.d),lead=(big?.17:.12)+(R()-.5)*skill*(1+s.d/9000);
    if(nx.x-(px+9)<v*lead){planned=nx;pressed=true;until=s.f+Math.max(1,Math.round((big?.2:.05)*60*(1+(R()-.5)*.6)));frames.push(s.f)}}
   if(pressed&&s.f>=until){pressed=false;frames.push(s.f)}
   hopStep(s,pressed)}
  if(pressed)frames.push(s.f);
  if(!best||Math.abs(s.score-target)<Math.abs(best.score-target))best={frames,score:s.score};
  if(Math.abs(s.score-target)<target*.06)break}
 return best}
function drawObs(p,o,sx){const G=HOP.G;
 if(o.k==='reel'){const r=o.h/2,cx=sx+o.w/2,cy=G-r;p.shape(ell(cx,cy,r,r,16),'#fff','#111',1.4,.7);const a0=o.x*.05;
  for(let i=0;i<5;i++){const a=a0+i*1.2566;p.ring(cx+Math.cos(a)*r*.55,cy+Math.sin(a)*r*.55,r*.2,'#111',1,.3,8)}p.dot(cx,cy,1.1,'#111');return}
 if(o.k==='clap'){p.shape([[sx,G-10],[sx+o.w,G-10],[sx+o.w,G],[sx,G]],'#fff','#111',1.4,.6);
  p.shape([[sx,G-11],[sx+o.w,G-15],[sx+o.w+1,G-12],[sx+1,G-8]],'#fff','#111',1.2,.5);for(const f of [.25,.55,.85])p.line([[sx+o.w*f,G-10.5-f*3],[sx+o.w*f+3,G-9-f*3]],'#e0302a',2,.3);return}
 const one=(x,w,h)=>{const P=[[x,G-h],[x+w,G-h],[x+w-3,G],[x+3,G]];p.shape(P,'#fff','#111',1.4,.6);
  for(const f of [.3,.5,.7])p.line([[x+w*f,G-h+2],[x+w*f+(f-.5)*2,G-1]],'#e0302a',1.8,.3);p.shape(P,null,'#111',1.3,.5);
  for(const [dx,dy,r] of [[.25,-1,2.6],[.55,-3,3],[.8,-1,2.4]])p.shape(ell(x+w*dx,G-h+dy,r,r,8),'#fff','#111',1,.4)};
 if(o.k==='double'){one(sx,18,18);one(sx+20,18,18)}else one(sx,o.w,o.h)}
const hopGhostCv=document.createElement('canvas');hopGhostCv.width=HOP.W;hopGhostCv.height=HOP.H;const hopGhostCx=hopGhostCv.getContext('2d');
function hopDraw(c,st){const {W,H,G,PX}=HOP,pl=st.player,d=pl.d;c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);
 const p=pen(c,1);const gp=[];for(let x=-6;x<=W+8;x+=16)gp.push([x,G]);p.line(gp,'#111',1.3,.7);
 const tp=pen(c,2);for(let k=0;k<14;k++){const span=W+40,x=((k*41-d)%span+span)%span-20,yy=G+6+(k%3)*5;tp.line([[x,yy],[x+4+(k%2)*5,yy]],'#111',1,.3)}
 for(const o of pl.course.obs){const sx=o.x-d;if(sx>W+40)break;if(sx+o.w<-40)continue;drawObs(pen(c,o.id*13+5),o,sx)}
 // ghosts' names (solid ink) and the player
 const gx=hopGhostCx;gx.clearRect(0,0,W,H);let li=0;
 for(const g of st.ghosts){const sx=PX+(g.run.d-d);if(sx<-40||sx>W+40)continue;const gy=G+g.run.y;
  cat(pen(gx,70+li),sx,gy,.44,{fill:null,col:'#000',w:1.5,a:.6,dead:g.run.dead,rot:g.run.dead?.5:0,eyes:'#000'});
  const lp=pen(c,90+li);lp.text(g.name+(g.run.dead?' '+g.run.score:''),sx,gy-27-(li%3)*9,8,'#111','center');li++}
 const sq=pl.landT>0?pl.landT/.16:0,air=!pl.ground&&!pl.dead;
 cat(pen(c,3),PX,G+pl.y,.44,{sx:air?.92:1+.18*sq,sy:air?1.08:1-.18*sq,dead:pl.dead,rot:pl.dead?.45:0,blink:!pl.dead&&(FRAME%37===0)});
 const hp=pen(c,4);hp.text(String(pl.score),W-8,17,15,'#e0302a','right');

   if(r.score>run.score){HOPG.runs.push({name:rival,score:r.score,frames:r.frames});addMsg({who:rival,kind:'card',game:'hop',gid:HOPG.gid,score:r.score,cap:rival+': '+r.score+' 🍿 · pak terug 😤',anim:true})}
   else addMsg({who:rival,kind:'text',text:['ok jij wint 🙄','hoe dan??','die ene emmer 😭'][Math.random()*3|0],anim:true})},2600+Math.random()*1400)}
 else if(top){setTimeout(()=>addMsg({who:top.name,kind:'text',text:['bijna 😏','haha nog '+(top.score-run.score)+' te gaan','spookje zegt hoi 👻'][Math.random()*3|0],anim:true}),2000+Math.random()*1200)}}

/* ---- Biljart */
const POOLS={};let poolN=0;
function newPool(opp,who){const gid='pool-'+(++poolN);POOLS[gid]={gid,opp,balls:rack(),groups:{me:null,[opp]:null},turn:who,over:null,replay:null};return gid}
function openPool(gid){const st=POOLS[gid];if(!st)return;
 if(st.over){const g=newPool(st.opp,st.over==='me'?st.opp:'me');addMsg({who:'me',kind:'card',game:'pool',gid:g,snap:cloneB(POOLS[g].balls),cap:'Nog een potje? 🎱',anim:true});if(POOLS[g].turn!=='me')botTurnLater(g);else openOv('Biljart',poolModule(g));return}
 if(st.turn!=='me'&&!st.replay){toast(st.opp+' is aan de beurt…');return}
 openOv('Biljart · tegen '+st.opp,poolModule(gid))}
function poolModule(gid){const st=POOLS[gid];let cv,cx,hint,raf=0,phase='idle',aim=null,drag=null,anim=null,turnShots=[],turnStart=null,notes=[];
 const status=()=>{const g=st.groups.me;hint.textContent=st.over?(st.over==='me'?'Jij wint! 🎱':st.opp+' wint 🎱'):st.turn==='me'?'Jij'+(g?' ('+g+')':'')+': sleep naar achteren om te mikken, loslaten = stoot':st.opp+' is aan de beurt'};
 const render=()=>drawPool(cx,st,phase==='aim'&&aim?aim:null);
 function toCanvas(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*PT.W,(e.clientY-r.top)/r.height*PT.H]}
 function animate(shot,done){anim={B:cloneB(st.balls),ev:{pocketed:[],first:null}};shoot(anim.B,shot);phase='anim';const vis={...st,balls:anim.B};
  const tick=()=>{for(let k=0;k<SUB;k++)poolStep(anim.B,PDT,anim.ev);drawPool(cx,vis,null);if(moving(anim.B))raf=requestAnimationFrame(tick);else{for(const b of anim.B)b.vx=b.vy=0;const a=anim;anim=null;done(a)}};raf=requestAnimationFrame(tick)}
 function myShot(shot){if(!turnStart)turnStart=cloneB(st.balls);turnShots.push(shot);
  animate(shot,({B,ev})=>{const res=judge(st,B,ev,'me');notes.push(res.note);render();status();
   if(st.turn==='me'&&!st.over){phase='aim';if(res.pk.length)toast(res.note+' · nog een keer!');return}
   phase='idle';const cap=st.over?(st.over==='me'?'Jij wint! 🎱':st.opp+' wint 🎱 ('+res.note+')'):'Jij: '+notes.join(', ')+' · '+st.opp+' is aan zet';
   const payload={shots:turnShots,start:turnStart,end:cloneB(st.balls)};turnShots=[];turnStart=null;notes=[];
   setTimeout(()=>{closeOv();addMsg({who:'me',kind:'card',game:'pool',gid,snap:payload.end,cap,anim:true,payload});if(!st.over)botTurnLater(gid)},900)})}
 function replay(done){const R=st.replay;st.replay=null;const saveEnd=R.end;st.balls=cloneB(R.start);render();hint.textContent=st.opp+' speelt…';let i=0;
  const nextShot=()=>{if(i>=R.shots.length){st.balls=cloneB(saveEnd);render();done();return}const s=R.shots[i++];animate(s,({B})=>{st.balls=B;render();setTimeout(nextShot,450)})};setTimeout(nextShot,500)}
 return{mount(el){const pap=document.createElement('div');pap.className='paper';cv=document.createElement('canvas');cv.id='poolc';cv.width=PT.W;cv.height=PT.H;pap.append(cv);cx=cv.getContext('2d');hint=document.createElement('p');hint.className='hint';el.append(pap,hint);
   cv.addEventListener('pointerdown',e=>{if(phase!=='aim')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch{}drag=toCanvas(e);aim=null});
   cv.addEventListener('pointermove',e=>{if(!drag||phase!=='aim')return;const [x,y]=toCanvas(e);let dx=drag[0]-x,dy=drag[1]-y;const L=Math.hypot(dx,dy);if(L<3){aim=null;render();return}aim={dx:dx/L,dy:dy/L,p:Math.min(1,L/110)};render();hint.textContent='kracht '+Math.round(aim.p*100)+'%'});
   const up=()=>{if(!drag)return;drag=null;if(phase==='aim'&&aim&&aim.p>.04){const s={dx:+aim.dx.toFixed(4),dy:+aim.dy.toFixed(4),p:+aim.p.toFixed(3)};aim=null;myShot(s)}else{aim=null;render();status()}};
   cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
   render();if(st.replay){phase='replay';replay(()=>{phase=st.turn==='me'&&!st.over?'aim':'idle';status();refreshLive(gid)})}else{phase=st.turn==='me'?'aim':'idle';status()}},
  unmount(){cancelAnimationFrame(raf)},
  tick12(){if(phase==='aim'||phase==='idle')render()},
  test:{shoot:(dx,dy,p)=>{if(phase==='aim')myShot({dx,dy,p})},state:()=>({phase,turn:st.turn,over:st.over,groups:st.groups,inPlay:st.balls.filter(b=>!b.in).length})}}}
// the friend's turn: shots until a miss; the chat gets one card with the shots + the authoritative end state
function botTurnLater(gid){const st=POOLS[gid];setTimeout(()=>typing(st.opp,true),800);
 setTimeout(()=>{typing(st.opp,false);if(st.turn!==st.opp||st.over)return;const start=cloneB(st.balls),shots=[],notes=[];let res;const err={Koen:.06,Bas:.08,Fre:.045}[st.opp]||.07;
  for(let k=0;k<7;k++){const shot=botShot(st,st.opp,err);const q={dx:+shot.dx.toFixed(4),dy:+shot.dy.toFixed(4),p:+shot.p.toFixed(3)};shots.push(q);const {B,ev}=simulate(st.balls,q);res=judge(st,B,ev,st.opp);notes.push(res.note);if(st.turn!==st.opp||st.over)break}
  st.replay={start,shots,end:cloneB(st.balls)};
  const cap=st.over?(st.over===st.opp?st.opp+' wint 🎱':'Jij wint! '+st.opp+': '+res.note):st.opp+': '+notes.join(', ')+' · jouw beurt';
  addMsg({who:st.opp,kind:'card',game:'pool',gid,snap:cloneB(st.balls),cap,anim:true});refreshLive(gid)},2400+Math.random()*1600)}

 b.onclick=()=>{sheet.hidden=true;dice.classList.remove('on');if(T.k==='hop')openOv('Pudding Hop',hopModule());else{const opp=['Koen','Bas','Fre'][Math.random()*3|0];const g=newPool(opp,'me');addMsg({who:'me',kind:'card',game:'pool',gid:g,snap:cloneB(POOLS[g].balls),cap:'Biljart tegen '+opp+' 🎱',anim:true});openOv('Biljart · tegen '+opp,poolModule(g))}};$('#tiles').append(b)}

 if(Math.random()<.5){const w=['Bas','Fre','Koen'][Math.random()*3|0];setTimeout(()=>typing(w,true),700);setTimeout(()=>{typing(w,false);addMsg({who:w,kind:'text',text:['haha','🔥','deal','zaterdag dan?','👀','eerst biljart'][Math.random()*6|0],anim:true})},1900)}}
$('#sendb').onclick=sendText;txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText()}});

HOPG.runs.push(seedRuns[0]);

{const g=newPool('Koen','me');addMsg({who:'Koen',kind:'card',game:'pool',gid:g,snap:cloneB(POOLS[g].balls),cap:'Koen daagt je uit: biljart 🎱',time:'20:46'})}

[build]
  command = "npm run build"
  publish = "dist"
  node_version = "20.11.1"

[build.environment]
  NODE_VERSION = "20.11.1"

[functions]
  directory = "netlify/functions"

# Filmmaand has been sunset: /filmmaand/ plays the short film "Te laat" and nothing else.
# Every old route (programme, votes, date poll, admin, API, films) lands there.
[[redirects]]
  from = "/filmmaand/*"
  to = "/filmmaand/"
  status = 302
  force = false

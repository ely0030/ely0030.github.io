[build]
  command = "npm run build"
  publish = "dist"
  node_version = "20.11.1"

[build.environment]
  NODE_VERSION = "20.11.1"

[functions]
  directory = "netlify/functions"

# Filmmaand has been sunset: /filmmaand/ plays the short film "Te laat" and nothing else.
# Every old section lands there (explicit paths, forced: a catch-all /filmmaand/* would also match /filmmaand/ itself).
[[redirects]]
  from = "/filmmaand/programma"
  to = "/filmmaand/"
  status = 302
  force = true

[[redirects]]
  from = "/filmmaand/programma/*"
  to = "/filmmaand/"
  status = 302
  force = true


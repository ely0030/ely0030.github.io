[build]
  command = "npm run build"
  publish = "dist"
  node_version = "20.11.1"

[build.environment]
  NODE_VERSION = "20.11.1"

[functions]
  directory = "netlify/functions"

[functions.filmmaand]
  node_bundler = "nft"
  external_node_modules = ["sharp"]
  included_files = ["filmmaand-server/**", "!filmmaand-server/*.test.mjs", "!filmmaand-server/operator/**", "!filmmaand-server/node_modules/@img/*musl*/**", "!filmmaand-server/node_modules/@img/sharp-wasm32/**"]

[[redirects]]
  from = "/filmmaand/agenda"
  to = "/filmmaand/programma/"
  status = 301
  force = true

[[redirects]]
  from = "/filmmaand/agenda/"
  to = "/filmmaand/programma/"
  status = 301
  force = true

[[redirects]]
  from = "/filmmaand/agenda/index.html"
  to = "/filmmaand/programma/"
  status = 301
  force = true

[[redirects]]
  from = "/filmmaand/program"
  to = "/filmmaand/programma/"
  status = 301
  force = true

[[redirects]]
  from = "/filmmaand/program/*"
  to = "/filmmaand/programma/:splat"
  status = 301
  force = true
